<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'clock - Gestion du temps</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>O'clock - Gestion du temps</h1>
    </header>
    
    <main>
        <section id="horloge">
            <h2>Horloge</h2>
            <div id="clock">00:00:00</div>
        </section>

        <section id="chronometre">
            <h2>Chronomètre</h2>
            <div id="affichage-chrono">00:00:00</div>
      <button id="bouton-chrono">Marche</button>
      <button id="bouton-reset">Reset</button>
      <button id="bouton-tour">Tour</button>
       <ul id="liste-tours"></ul>
        </section>

        <section id="minuteur">
            <h2>Minuteur</h2>
            <div id="affichage-minuteur">00:00</div>
    <input type="number" id="input-minutes" placeholder="minutes" min="0">
    <input type="number" id="input-secondes" placeholder="secondes" min="0">
    <button id="bouton-minuteur">Démarrer</button>
        </section>

        <section id="reveil">
            <h2>Réveil</h2>
            <input type="time" id="input-heure-alarme">
    <input type="text" id="input-message-alarme" placeholder="Votre message">
    <button id="bouton-ajouter-alarme">Ajouter alarme</button>
    <ul id="liste-alarmes"></ul>
    <div id="zone-alertes"></div>
        </section>
    </main>

    <script src="script.js"></script> 
</body>
</html>
